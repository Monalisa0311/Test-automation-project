
name: Python automation tests

on:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: write

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automation tests
        run: |
          pytest -v -n 2 \
            --html=reports/github_actions_test_report.html \
            --self-contained-html \
            --junitxml=reports/github_actions_junit_report.xml

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-actions-test-report
          path: reports/github_actions_test_report.html

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Pytest Results
          path: reports/github_actions_junit_report.xml
          reporter: java-junit
